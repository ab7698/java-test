name: Java version

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  print-java-version:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: latest
          check-latest: true
      - name: Print Java version
        run: java -version